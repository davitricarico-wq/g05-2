<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cinco Forças de Porter — Unipar</title>
  <desc id="desc">Rivalidade alta, ameaça de novos entrantes baixa, ameaça de substitutos média, poder dos fornecedores médio e poder dos compradores médio a alto.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31556f"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #17324d; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #526979; }
      .box-title { font: 700 21px Arial, Helvetica, sans-serif; fill: #17324d; }
      .level { font: 700 20px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .center-title { font: 700 25px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .center-text { font: 400 17px Arial, Helvetica, sans-serif; fill: #eaf4fa; }
      .line { fill: none; stroke: #31556f; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f5f8fa"/>
  <text x="600" y="54" text-anchor="middle" class="title">Cinco Forças de Porter — Unipar</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">Mercados sul-americanos de cloro, soda cáustica e PVC</text>

  <path class="line" d="M 600 238 L 600 286"/>
  <path class="line" d="M 600 592 L 600 544"/>
  <path class="line" d="M 378 415 L 456 415"/>
  <path class="line" d="M 822 415 L 744 415"/>

  <g filter="url(#shadow)">
    <rect x="420" y="116" width="360" height="122" rx="18" fill="#ffffff" stroke="#b9cbd7" stroke-width="2"/>
    <text x="600" y="155" text-anchor="middle" class="box-title">Ameaça de novos entrantes</text>
    <rect x="522" y="176" width="156" height="42" rx="21" fill="#31835d"/>
    <text x="600" y="204" text-anchor="middle" class="level">BAIXA</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="592" width="360" height="122" rx="18" fill="#ffffff" stroke="#b9cbd7" stroke-width="2"/>
    <text x="600" y="631" text-anchor="middle" class="box-title">Ameaça de substitutos</text>
    <rect x="522" y="652" width="156" height="42" rx="21" fill="#d18a27"/>
    <text x="600" y="680" text-anchor="middle" class="level">MÉDIA</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="52" y="354" width="326" height="122" rx="18" fill="#ffffff" stroke="#b9cbd7" stroke-width="2"/>
    <text x="215" y="393" text-anchor="middle" class="box-title">Poder dos fornecedores</text>
    <rect x="137" y="414" width="156" height="42" rx="21" fill="#d18a27"/>
    <text x="215" y="442" text-anchor="middle" class="level">MÉDIA</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="822" y="354" width="326" height="122" rx="18" fill="#ffffff" stroke="#b9cbd7" stroke-width="2"/>
    <text x="985" y="393" text-anchor="middle" class="box-title">Poder dos compradores</text>
    <rect x="888" y="414" width="194" height="42" rx="21" fill="#df6b35"/>
    <text x="985" y="442" text-anchor="middle" class="level">MÉDIA A ALTA</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="456" y="286" width="288" height="258" rx="28" fill="#245675"/>
    <text x="600" y="349" text-anchor="middle" class="center-title">Rivalidade entre</text>
    <text x="600" y="381" text-anchor="middle" class="center-title">os concorrentes</text>
    <rect x="522" y="413" width="156" height="46" rx="23" fill="#b93d42"/>
    <text x="600" y="444" text-anchor="middle" class="level">ALTA</text>
    <text x="600" y="492" text-anchor="middle" class="center-text">Intensidade varia por</text>
    <text x="600" y="517" text-anchor="middle" class="center-text">produto e região</text>
  </g>
</svg>
