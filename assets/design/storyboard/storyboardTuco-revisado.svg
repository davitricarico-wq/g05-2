<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-label="Storyboard de Tuco Salamanca"><title>Storyboard de Tuco Salamanca</title><desc>Sete cenas que distinguem o CCO, a SSMA e as respostas da solução proposta.</desc><rect x="0" y="0" width="1600" height="970" rx="0" fill="#ffffff" stroke="none"/><rect x="0" y="0" width="1600" height="125" rx="0" fill="#08764f" stroke="none"/><text x="38" y="58" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Storyboard — Tuco Salamanca</text><text x="38" y="96" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff">Coordenação da SSMA em campo · cenário futuro</text><rect x="28" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="28" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="46" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">1 · Coordenação</text><text x="46" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="46" y="283" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Tuco organiza as equipes em campo e</text><text x="46" y="307" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">mantém contato com o CCO.</text><text x="46" y="383" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="46" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O CCO acompanha os indicadores e</text><text x="46" y="437" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">repassa alertas pelo rádio.</text><rect x="420" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="420" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="438" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">2 · Verificação</text><text x="438" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="438" y="283" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Tuco confirma a ocorrência com</text><text x="438" y="307" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">líderes e agentes da planta.</text><text x="438" y="383" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="438" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O alerta permanece em validação até</text><text x="438" y="437" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">o fluxo autorizado da Unipar.</text><rect x="812" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="812" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="830" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">3 · Alarme</text><text x="830" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="830" y="283" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O alarme existente é acionado; Tuco</text><text x="830" y="307" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">orienta a evacuação.</text><text x="830" y="383" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="830" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">A integração abre o evento e ativa</text><text x="830" y="437" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">os totens designados.</text><rect x="1204" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="1204" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="1222" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">4 · Pontos de encontro</text><text x="1222" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="1222" y="283" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Tuco orienta brigadistas e líderes</text><text x="1222" y="307" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">durante a saída das pessoas.</text><text x="1222" y="383" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="1222" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Portarias, zonas e totens registram</text><text x="1222" y="437" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">dados separados.</text><rect x="28" y="537" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="28" y="537" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="46" y="576" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">5 · Balanço</text><text x="46" y="633" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="46" y="663" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O CCO informa B₀=320, M=298 e 22</text><text x="46" y="687" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">pendências a conferir.</text><text x="46" y="763" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="46" y="793" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O painel mostra fontes e horários;</text><text x="46" y="817" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">não conclui segurança.</text><rect x="420" y="537" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="420" y="537" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="438" y="576" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">6 · Dez minutos</text><text x="438" y="633" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="438" y="663" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Após novas confirmações, restam duas</text><text x="438" y="687" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">pendências; Tuco confere com</text><text x="438" y="711" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">líderes.</text><text x="438" y="763" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="438" y="793" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O CCO informa a última zona como</text><text x="438" y="817" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">pista histórica de passagem.</text><rect x="812" y="537" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="812" y="537" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="830" y="576" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">7 · Decisão</text><text x="830" y="633" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="830" y="663" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Líderes verificam as pessoas; a SSMA</text><text x="830" y="687" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">decide encerrar.</text><text x="830" y="763" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="830" y="793" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O CCO desliga o alarme e registra</text><text x="830" y="817" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">decisão e justificativa.</text><text x="1210" y="618" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">A última zona é uma pista</text><text x="1210" y="645" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#42536a">de passagem, não localização.</text><text x="28" y="946" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#42536a">Números ilustrativos. O saldo zero isolado não comprova segurança nem encerra a emergência.</text></svg>