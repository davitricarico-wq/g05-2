<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-label="Storyboard de Tuco Salamanca"><title>Storyboard de Tuco Salamanca</title><desc>Sete cenas que distinguem o CCO, a SSMA e as respostas da solução proposta.</desc><rect x="0" y="0" width="1600" height="970" rx="0" fill="#ffffff" stroke="none"/><rect x="0" y="0" width="1600" height="125" rx="0" fill="#08764f" stroke="none"/><text x="38" y="58" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Storyboard — Tuco Salamanca</text><text x="38" y="96" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff">Coordenação da SSMA em campo · cenário futuro</text><rect x="28" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="28" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="46" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">1 · Coordenação</text><rect x="46" y="227" width="334" height="78" rx="8" fill="#edf5f0" stroke="none"/><text x="58" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AMBIENTE · Campo e CCO</text><circle cx="83" cy="277" r="9" fill="#08764f"/><rect x="72" y="287" width="22" height="11" rx="3" fill="#08764f" stroke="none"/><rect x="283" y="265" width="70" height="30" rx="3" fill="#ffffff" stroke="#cbd7d1"/><path d="M291 287 L305 279 L317 284 L335 273" fill="none" stroke="#08764f" stroke-width="2"/><text x="46" y="327" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="46" y="353" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Tuco organiza as equipes em campo e</text><text x="46" y="377" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">mantém contato com o CCO.</text><text x="46" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="46" y="449" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O CCO acompanha os indicadores e</text><text x="46" y="473" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">repassa alertas pelo rádio.</text><rect x="420" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="420" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="438" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">2 · Verificação</text><rect x="438" y="227" width="334" height="78" rx="8" fill="#edf5f0" stroke="none"/><text x="450" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AMBIENTE · Campo</text><circle cx="475" cy="277" r="9" fill="#08764f"/><rect x="464" y="287" width="22" height="11" rx="3" fill="#08764f" stroke="none"/><rect x="675" y="265" width="70" height="30" rx="3" fill="#ffffff" stroke="#cbd7d1"/><path d="M683 287 L697 279 L709 284 L727 273" fill="none" stroke="#08764f" stroke-width="2"/><text x="438" y="327" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="438" y="353" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Tuco confirma a ocorrência com</text><text x="438" y="377" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">líderes e agentes da planta.</text><text x="438" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="438" y="449" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O alerta permanece em validação até</text><text x="438" y="473" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">o fluxo autorizado da Unipar.</text><rect x="812" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="812" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="830" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">3 · Alarme</text><rect x="830" y="227" width="334" height="78" rx="8" fill="#edf5f0" stroke="none"/><text x="842" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AMBIENTE · Campo e alarme</text><circle cx="867" cy="277" r="9" fill="#08764f"/><rect x="856" y="287" width="22" height="11" rx="3" fill="#08764f" stroke="none"/><rect x="1067" y="265" width="70" height="30" rx="3" fill="#ffffff" stroke="#cbd7d1"/><path d="M1075 287 L1089 279 L1101 284 L1119 273" fill="none" stroke="#08764f" stroke-width="2"/><text x="830" y="327" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="830" y="353" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O alarme existente é acionado; Tuco</text><text x="830" y="377" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">orienta a evacuação.</text><text x="830" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="830" y="449" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">A integração abre o evento e ativa</text><text x="830" y="473" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">os totens designados.</text><rect x="1204" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="1204" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="1222" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">4 · Pontos de encontro</text><rect x="1222" y="227" width="334" height="78" rx="8" fill="#edf5f0" stroke="none"/><text x="1234" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AMBIENTE · Ponto de encontro</text><circle cx="1259" cy="277" r="9" fill="#08764f"/><rect x="1248" y="287" width="22" height="11" rx="3" fill="#08764f" stroke="none"/><rect x="1459" y="265" width="70" height="30" rx="3" fill="#ffffff" stroke="#cbd7d1"/><path d="M1467 287 L1481 279 L1493 284 L1511 273" fill="none" stroke="#08764f" stroke-width="2"/><text x="1222" y="327" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="1222" y="353" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Tuco orienta brigadistas e líderes</text><text x="1222" y="377" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">durante a saída das pessoas.</text><text x="1222" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="1222" y="449" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Portarias, zonas e totens registram</text><text x="1222" y="473" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">dados separados.</text><rect x="28" y="537" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="28" y="537" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="46" y="576" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">5 · Balanço</text><rect x="46" y="607" width="334" height="78" rx="8" fill="#edf5f0" stroke="none"/><text x="58" y="633" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AMBIENTE · Campo e rádio</text><circle cx="83" cy="657" r="9" fill="#08764f"/><rect x="72" y="667" width="22" height="11" rx="3" fill="#08764f" stroke="none"/><rect x="283" y="645" width="70" height="30" rx="3" fill="#ffffff" stroke="#cbd7d1"/><path d="M291 667 L305 659 L317 664 L335 653" fill="none" stroke="#08764f" stroke-width="2"/><text x="46" y="707" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="46" y="733" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O CCO informa B₀=320, M=298 e 22</text><text x="46" y="757" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">pendências a conferir.</text><text x="46" y="805" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="46" y="829" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O painel mostra fontes e horários;</text><text x="46" y="853" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">não conclui segurança.</text><rect x="420" y="537" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="420" y="537" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="438" y="576" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">6 · Dez minutos</text><rect x="438" y="607" width="334" height="78" rx="8" fill="#edf5f0" stroke="none"/><text x="450" y="633" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AMBIENTE · Campo e Zona B</text><circle cx="475" cy="657" r="9" fill="#08764f"/><rect x="464" y="667" width="22" height="11" rx="3" fill="#08764f" stroke="none"/><rect x="675" y="645" width="70" height="30" rx="3" fill="#ffffff" stroke="#cbd7d1"/><path d="M683 667 L697 659 L709 664 L727 653" fill="none" stroke="#08764f" stroke-width="2"/><text x="438" y="707" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="438" y="733" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Após novas confirmações, restam duas</text><text x="438" y="757" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">pendências; Tuco confere com</text><text x="438" y="781" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">líderes.</text><text x="438" y="805" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="438" y="829" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O CCO informa a última zona como</text><text x="438" y="853" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">pista histórica de passagem.</text><rect x="812" y="537" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="812" y="537" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="830" y="576" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">7 · Decisão</text><rect x="830" y="607" width="334" height="78" rx="8" fill="#edf5f0" stroke="none"/><text x="842" y="633" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AMBIENTE · Campo e CCO</text><circle cx="867" cy="657" r="9" fill="#08764f"/><rect x="856" y="667" width="22" height="11" rx="3" fill="#08764f" stroke="none"/><rect x="1067" y="645" width="70" height="30" rx="3" fill="#ffffff" stroke="#cbd7d1"/><path d="M1075 667 L1089 659 L1101 664 L1119 653" fill="none" stroke="#08764f" stroke-width="2"/><text x="830" y="707" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="830" y="733" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Líderes verificam as pessoas; a SSMA</text><text x="830" y="757" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">decide encerrar.</text><text x="830" y="805" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="830" y="829" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O CCO desliga o alarme e registra</text><text x="830" y="853" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">decisão e justificativa.</text><text x="1210" y="618" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">A última zona é uma pista</text><text x="1210" y="645" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#42536a">de passagem, não localização.</text><text x="28" y="946" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#42536a">Números ilustrativos. O saldo zero isolado não comprova segurança nem encerra a emergência.</text></svg>