<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-label="Storyboard de Maria Schrader"><title>Storyboard de Maria Schrader</title><desc>Sete cenas que distinguem o CCO, a SSMA e as respostas da solução proposta.</desc><rect x="0" y="0" width="1600" height="970" rx="0" fill="#ffffff" stroke="none"/><rect x="0" y="0" width="1600" height="125" rx="0" fill="#08764f" stroke="none"/><text x="38" y="58" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Storyboard — Maria Schrader</text><text x="38" y="96" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#ffffff">Evacuação acompanhada pelo CCO · cenário futuro</text><rect x="28" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="28" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="46" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">1 · Monitoramento</text><text x="46" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="46" y="283" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Maria acompanha alarmes e</text><text x="46" y="307" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">indicadores da planta.</text><text x="46" y="383" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="46" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Sistemas operacionais mostram</text><text x="46" y="437" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">condições e horários.</text><rect x="420" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="420" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="438" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">2 · Verificação</text><text x="438" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="438" y="283" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Maria confirma a ocorrência conforme</text><text x="438" y="307" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">o procedimento da unidade.</text><text x="438" y="383" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="438" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O alerta segue em validação; a SSMA</text><text x="438" y="437" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">é informada.</text><rect x="812" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="812" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="830" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">3 · Acionamento</text><text x="830" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="830" y="283" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O alarme existente é acionado pelo</text><text x="830" y="307" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">fluxo autorizado da Unipar.</text><text x="830" y="383" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="830" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">A integração abre o evento e ativa</text><text x="830" y="437" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">os totens designados.</text><rect x="1204" y="157" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="1204" y="157" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="1222" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">4 · Evacuação</text><text x="1222" y="253" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="1222" y="283" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Pessoas saem das áreas e aproximam</text><text x="1222" y="307" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">crachás dos totens.</text><text x="1222" y="383" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="1222" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Portarias contam passagens; zonas e</text><text x="1222" y="437" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">PEs enviam registros.</text><rect x="28" y="537" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="28" y="537" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="46" y="576" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">5 · Painel do CCO</text><text x="46" y="633" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="46" y="663" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Maria consulta B₀=320, M=298 e 22</text><text x="46" y="687" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">pendências a conferir.</text><text x="46" y="763" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="46" y="793" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">A tela separa estimativa,</text><text x="46" y="817" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">confirmações e validade dos dados.</text><rect x="420" y="537" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="420" y="537" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="438" y="576" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">6 · Dez minutos</text><text x="438" y="633" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="438" y="663" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Após novas confirmações, restam duas</text><text x="438" y="687" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">pendências; Maria avisa a SSMA.</text><text x="438" y="763" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="438" y="793" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O painel mostra horários e última</text><text x="438" y="817" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">zona, sem indicar posição atual.</text><rect x="812" y="537" width="370" height="348" rx="12" fill="#ffffff" stroke="#cbd7d1"/><rect x="812" y="537" width="370" height="60" rx="12" fill="#edf5f0" stroke="none"/><text x="830" y="576" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#08764f">7 · Encerramento</text><text x="830" y="633" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">AÇÃO</text><text x="830" y="663" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">Líderes conferem as pessoas; a SSMA</text><text x="830" y="687" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">decide o fim da operação.</text><text x="830" y="763" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#08764f">REAÇÃO DO SISTEMA</text><text x="830" y="793" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">O CCO desliga o alarme e registra</text><text x="830" y="817" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162433">decisão, hora e justificativa.</text><text x="1210" y="618" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">A última zona é uma pista</text><text x="1210" y="645" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#42536a">de passagem, não localização.</text><text x="28" y="946" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#42536a">Números ilustrativos. O saldo zero isolado não comprova segurança nem encerra a emergência.</text></svg>