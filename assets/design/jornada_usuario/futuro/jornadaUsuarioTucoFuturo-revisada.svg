<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1250" viewBox="0 0 1700 1250" role="img" aria-label="Jornada futura · coordenação em campo — Tuco Salamanca"><title>Jornada futura · coordenação em campo — Tuco Salamanca</title><desc>Jornada futura em quatro fases, com ações, pensamentos, contatos, riscos, insights e oportunidades.</desc><rect x="0" y="0" width="1700" height="1250" rx="0" fill="#ffffff" stroke="none"/><rect x="0" y="0" width="1700" height="145" rx="0" fill="#08764f" stroke="none"/><text x="45" y="63" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Tuco Salamanca</text><text x="45" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#ffffff">Gestor de SSMA</text><text x="730" y="80" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Jornada futura · coordenação em campo</text><text x="30" y="211" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">FASES</text><rect x="180" y="168" width="350" height="82" rx="12" fill="#edf5f0" stroke="#cbd7d1"/><text x="198" y="198" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#08764f">01</text><text x="232" y="198" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162433">Alerta e ativação</text><rect x="550" y="168" width="350" height="82" rx="12" fill="#edf5f0" stroke="#cbd7d1"/><text x="568" y="198" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#08764f">02</text><text x="602" y="198" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162433">Evacuação e registros</text><rect x="920" y="168" width="350" height="82" rx="12" fill="#edf5f0" stroke="#cbd7d1"/><text x="938" y="198" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#08764f">03</text><text x="972" y="198" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162433">Pendências após 10 min</text><rect x="1290" y="168" width="350" height="82" rx="12" fill="#edf5f0" stroke="#cbd7d1"/><text x="1308" y="198" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#08764f">04</text><text x="1342" y="198" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162433">Conferência e encerramento</text><text x="30" y="312" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">AÇÕES</text><rect x="180" y="278" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="309" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Recebe o alerta do CCO e orienta</text><text x="198" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">agentes e brigadistas em campo.</text><rect x="550" y="278" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="309" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Coordena a ida aos PEs e acompanha</text><text x="568" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">informes recebidos pelo rádio.</text><rect x="920" y="278" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="309" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Confere pendências com líderes dos</text><text x="938" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">PEs e orienta busca cautelosa.</text><rect x="1290" y="278" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="309" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Após conferência humana, a SSMA</text><text x="1308" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">decide o fim e avisa o CCO.</text><text x="30" y="470" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">PENSAMENTOS E SENTIMENTOS</text><rect x="180" y="436" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="467" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Cautela: preciso confirmar o risco e</text><text x="198" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">proteger as equipes.</text><rect x="550" y="436" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="467" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Atenção: os registros ajudam, mas</text><text x="568" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">podem chegar atrasados.</text><rect x="920" y="436" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="467" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Tensão: a última zona é uma pista,</text><text x="938" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">não a posição atual.</text><rect x="1290" y="436" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="467" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Alívio condicionado à conferência</text><text x="1308" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">real das pessoas.</text><text x="30" y="628" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">PONTOS DE CONTATO</text><rect x="180" y="594" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="625" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Rádio, CCO, equipes de campo e</text><text x="198" y="648" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">procedimento da Unipar.</text><rect x="550" y="594" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="625" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Líderes dos PEs, brigadistas e</text><text x="568" y="648" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">informações repassadas pelo CCO.</text><rect x="920" y="594" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="625" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Rádio, lista nominal autorizada,</text><text x="938" y="648" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">horário e última zona registrada.</text><rect x="1290" y="594" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="625" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Líderes, CCO e registro auditável da</text><text x="1308" y="648" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">decisão.</text><text x="30" y="786" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">DORES E RISCOS</text><rect x="180" y="752" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="783" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Alarme ou fonte de dados pode estar</text><text x="198" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">incompleto.</text><rect x="550" y="752" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="783" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Filas, leituras ausentes e falha de</text><text x="568" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">rede atrasam confirmações.</text><rect x="920" y="752" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="783" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Zona antiga pode induzir busca no</text><text x="938" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">local errado.</text><rect x="1290" y="752" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="783" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Saldo zero não comprova segurança</text><text x="1308" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">individual.</text><text x="30" y="944" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">INSIGHTS</text><rect x="180" y="910" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="941" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">O alarme da Unipar abre o evento</text><text x="198" y="964" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">integrado.</text><rect x="550" y="910" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="941" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Confirmação no totem registra</text><text x="568" y="964" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">chegada; não mede ocupação atual.</text><rect x="920" y="910" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="941" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Comparar fonte nominal e horários</text><text x="938" y="964" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">reduz conclusões precipitadas.</text><rect x="1290" y="910" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="941" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">A decisão é humana; o CCO executa o</text><text x="1308" y="964" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">desligamento oficial.</text><text x="30" y="1102" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">OPORTUNIDADES</text><rect x="180" y="1068" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="1099" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Mostrar fonte e validade do alerta</text><text x="198" y="1122" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">desde o início.</text><rect x="550" y="1068" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="1099" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Indicar atraso, fila offline e</text><text x="568" y="1122" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">confirmação local claramente.</text><rect x="920" y="1068" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="1099" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Destacar dados inconclusivos e</text><text x="938" y="1122" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">histórico da última passagem.</text><rect x="1290" y="1068" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="1099" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Registrar responsável, horário e</text><text x="1308" y="1122" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">justificativa do encerramento.</text><text x="30" y="1230" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#42536a">Cenário projetado; não representa sistema implantado nem validação física.</text></svg>