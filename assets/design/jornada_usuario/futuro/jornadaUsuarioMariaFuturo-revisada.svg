<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1250" viewBox="0 0 1700 1250" role="img" aria-label="Jornada futura · acompanhamento no CCO — Maria Schrader"><title>Jornada futura · acompanhamento no CCO — Maria Schrader</title><desc>Jornada futura em quatro fases, com ações, pensamentos, contatos, riscos, insights e oportunidades.</desc><rect x="0" y="0" width="1700" height="1250" rx="0" fill="#ffffff" stroke="none"/><rect x="0" y="0" width="1700" height="145" rx="0" fill="#08764f" stroke="none"/><text x="45" y="63" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Maria Schrader</text><text x="45" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#ffffff">Operadora de CCO</text><text x="730" y="80" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Jornada futura · acompanhamento no CCO</text><text x="30" y="211" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">FASES</text><rect x="180" y="168" width="350" height="82" rx="12" fill="#edf5f0" stroke="#cbd7d1"/><text x="198" y="198" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#08764f">01</text><text x="232" y="198" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162433">Monitoramento</text><rect x="550" y="168" width="350" height="82" rx="12" fill="#edf5f0" stroke="#cbd7d1"/><text x="568" y="198" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#08764f">02</text><text x="602" y="198" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162433">Verificação e ativação</text><rect x="920" y="168" width="350" height="82" rx="12" fill="#edf5f0" stroke="#cbd7d1"/><text x="938" y="198" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#08764f">03</text><text x="972" y="198" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162433">Acompanhamento</text><rect x="1290" y="168" width="350" height="82" rx="12" fill="#edf5f0" stroke="#cbd7d1"/><text x="1308" y="198" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#08764f">04</text><text x="1342" y="198" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162433">Conferência e registro</text><text x="30" y="312" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">AÇÕES</text><rect x="180" y="278" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="309" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Acompanha indicadores e relatos das</text><text x="198" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">equipes.</text><rect x="550" y="278" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="309" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Confirma a ocorrência e segue o fluxo</text><text x="568" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">autorizado do alarme.</text><rect x="920" y="278" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="309" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Consulta estimativas, confirmações e</text><text x="938" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">horários no painel.</text><rect x="1290" y="278" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="309" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Comunica pendências à SSMA; registra</text><text x="1308" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">o fim após decisão dela.</text><text x="30" y="470" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">PENSAMENTOS E SENTIMENTOS</text><rect x="180" y="436" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="467" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Atenção: preciso distinguir sinais</text><text x="198" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">relevantes.</text><rect x="550" y="436" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="467" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Cautela: a ocorrência e as fontes</text><text x="568" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">devem ser validadas.</text><rect x="920" y="436" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="467" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Preocupação: dados ausentes não</text><text x="938" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">significam zero pendências.</text><rect x="1290" y="436" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="467" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Alívio após conferência humana e</text><text x="1308" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">registro completo.</text><text x="30" y="628" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">PONTOS DE CONTATO</text><rect x="180" y="594" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="625" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Painéis operacionais, câmeras e</text><text x="198" y="648" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">rádio.</text><rect x="550" y="594" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="625" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Procedimentos da Unipar, SSMA e</text><text x="568" y="648" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">sistema de alarme.</text><rect x="920" y="594" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="625" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Aplicação web, portarias, leitores de</text><text x="938" y="648" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">zona e totens.</text><rect x="1290" y="594" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="625" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">SSMA, líderes dos PEs e trilha de</text><text x="1308" y="648" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">auditoria.</text><text x="30" y="786" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">DORES E RISCOS</text><rect x="180" y="752" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="783" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Muitos alarmes dificultam a triagem.</text><rect x="550" y="752" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="783" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Falha de conexão pode exigir ativação</text><text x="568" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">local do totem.</text><rect x="920" y="752" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="783" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Leitura repetida ou tardia pode</text><text x="938" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">distorcer o balanço.</text><rect x="1290" y="752" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="783" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Fontes divergentes exigem</text><text x="1308" y="806" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">investigação, não encerramento</text><text x="1308" y="829" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">automático.</text><text x="30" y="944" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">INSIGHTS</text><rect x="180" y="910" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="941" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Visibilidade da origem dos alertas</text><text x="198" y="964" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">melhora a decisão.</text><rect x="550" y="910" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="941" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Ativação integrada depende do alarme</text><text x="568" y="964" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">existente.</text><rect x="920" y="910" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="941" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Última zona indica passagem, não</text><text x="938" y="964" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">localização atual.</text><rect x="1290" y="910" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="941" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">A SSMA decide; o CCO desliga</text><text x="1308" y="964" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">oficialmente o alarme.</text><text x="30" y="1102" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#08764f">OPORTUNIDADES</text><rect x="180" y="1068" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="198" y="1099" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Destacar alertas críticos e seus</text><text x="198" y="1122" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">horários.</text><rect x="550" y="1068" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="568" y="1099" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Registrar contingência e estado dos</text><text x="568" y="1122" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">totens.</text><rect x="920" y="1068" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="938" y="1099" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Exibir atualização, inconclusão e</text><text x="938" y="1122" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">origem de cada indicador.</text><rect x="1290" y="1068" width="350" height="150" rx="10" fill="#ffffff" stroke="#cbd7d1"/><text x="1308" y="1099" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">Guardar decisão, operador, horário e</text><text x="1308" y="1122" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162433">justificativa.</text><text x="30" y="1230" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#42536a">Cenário projetado; não representa sistema implantado nem validação física.</text></svg>